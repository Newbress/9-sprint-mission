name: Deploy to Amazon ECS

on:
  push:
    branches: [ "release" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Java 및 Gradle 환경 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        working-directory: ./discodeit
        run: chmod +x gradlew

      # 2. 프로젝트 빌드 (테스트는 CI에서 통과했으므로 제외)
      - name: Build with Gradle
        working-directory: ./discodeit
        run: ./gradlew clean build -x test

      # 3. AWS 자격 증명 설정 (Public ECR 로그인을 위해 리전은 us-east-1 고정)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      # 4. Amazon ECR Public 로그인
      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # 5. Docker 이미지 빌드 및 푸시 (latest 및 sha 태그 적용)
      - name: Build, tag, and push image to Amazon ECR Public
        working-directory: ./discodeit
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY_URI }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REPOSITORY:$IMAGE_TAG .
          docker tag $REPOSITORY:$IMAGE_TAG $REPOSITORY:latest
          docker push $REPOSITORY:$IMAGE_TAG
          docker push $REPOSITORY:latest

      - name: Switch AWS credentials to ECS region
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # 6. 현재 동작 중인 최신 ECS 태스크 정의 다운로드
      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_DEFINITION }} \
            --region ${{ vars.AWS_REGION }} \
            --query taskDefinition > raw-task-definition.json
          
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .enableFaultInjection)' raw-task-definition.json > task-definition.json
      # 7. 태스크 정의에 새 이미지 주입
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: discodeit-app
          image: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}

      # 8. [프리티어 최적화] 기존 서비스 중단 (Scale down to 0)
      # 새 컨테이너가 뜰 메모리 여유 공간을 확보하기 위해 기존 컨테이너를 먼저 종료합니다.
      - name: Stop current service (Scale down to 0)
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --desired-count 0 \
            --region ${{ vars.AWS_REGION }}

      # 9. ECS 서비스 업데이트 (새 태스크 정의 적용 및 배포)
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          region: ${{ vars.AWS_REGION }}
          wait-for-service-stability: true